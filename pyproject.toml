[project]
name = "anvil"
version = "0.1.0"
description = "Anvil — research fork of xAI Grok-1. Triton RoPE and correctness-gated benchmarks. Not affiliated with xAI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }

[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.lint]
ignore = [
    "E722",
    "E731",
    "E741",
    "F405",
    "E402",
    "F403",
]
select = ["ISC001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
