name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rope:
    name: RoPE tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests/test_rope.py -v
