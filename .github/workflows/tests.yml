name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rope:
    name: RoPE tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Haiku/Flax may pull a newer jaxlib; keep the pinned JAX pair.
          pip install --force-reinstall "jax==0.4.25" "jaxlib==0.4.25" "numpy==1.26.4"
      - name: Check JAX versions
        run: python -c "import jax; print('jax', jax.__version__); print('jaxlib', jax._src.lib.version)"
      - name: Test
        run: python -m pytest tests/test_rope.py -v
